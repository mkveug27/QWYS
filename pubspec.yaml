name: qwys
description: "Quiz application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  async: ^2.13.1
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.9
  dio: ^5.10.0
  equatable: ^2.1.0
  fluttertoast: ^10.0.2
  flutter_bloc: ^9.1.1
  flutter_cache_manager: ^3.4.1
  flutter_dotenv: ^6.0.1
  flutter_flavorizr: ^2.4.2
  flutter_secure_storage: ^10.3.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  get_it: ^9.2.1
  go_router: ^17.3.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  package_info_plus: ^9.0.0
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  simple_animations: ^5.2.0
  slang: ^4.18.0
  slang_flutter: ^4.18.0
  talker_dio_logger: ^5.1.16
  talker_flutter: ^5.1.16

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.13.1
  flutter_lints: ^6.0.0
  json_serializable: ^6.14.0
  slang_build_runner: ^4.18.0

flutter:
  uses-material-design: true
  generate: true
  config:
    enable-swift-package-manager: false

  assets:
    - .env
    - assets/
    - assets/app/

  fonts:
    - family: Cormorant
      fonts:
        - asset: assets/fonts/Cormorant/Cormorant-Bold.ttf
        - asset: assets/fonts/Cormorant/Cormorant-BoldItalic.ttf
        - asset: assets/fonts/Cormorant/Cormorant-Italic.ttf
        - asset: assets/fonts/Cormorant/Cormorant-Light.ttf
        - asset: assets/fonts/Cormorant/Cormorant-LightItalic.ttf
        - asset: assets/fonts/Cormorant/Cormorant-Medium.ttf
        - asset: assets/fonts/Cormorant/Cormorant-MediumItalic.ttf
        - asset: assets/fonts/Cormorant/Cormorant-Regular.ttf
        - asset: assets/fonts/Cormorant/Cormorant-SemiBold.ttf
        - asset: assets/fonts/Cormorant/Cormorant-SemiBoldItalic.ttf
    - family: qwys
      fonts:
        - asset: assets/fonts/qwys/qwys.ttf
